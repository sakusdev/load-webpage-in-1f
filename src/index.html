<body>
<header class="top">
  <a class="brand" href="/" aria-label="1F home"><span>1F</span><i></i></a>
  <div class="status"><b></b>first-flight architecture</div>
</header>
<main>
  <section class="hero" aria-labelledby="hero-title">
    <p class="kicker">8.33 ms target · 120 Hz</p>
    <h1 id="hero-title">Load the web<br><em>in one frame.</em></h1>
    <p class="lede">One document. Zero render-blocking dependencies. Everything below the fold waits its turn.</p>
    <div class="actions">
      <a class="primary" href="#architecture">See the architecture <span>↘</span></a>
      <span class="budget">≤ 12 KiB Brotli</span>
    </div>
    <div class="metrics" aria-label="performance contract">
      <div><strong>1</strong><span>initial request</span></div>
      <div><strong>0</strong><span>frameworks</span></div>
      <div><strong>0</strong><span>web fonts</span></div>
      <div><strong>1F</strong><span>first viewport</span></div>
    </div>
  </section>
  <section id="architecture" class="slot next" data-fragment="/fragments/next.html" aria-busy="true"></section>
  <section class="slot deep" data-fragment="/fragments/deep.html" aria-busy="true"></section>
</main>
